databases:
  - name: lifeos-db
    databaseName: lifeos
    user: lifeos
    plan: 0.1c-256mb

services:
  - type: web
    name: lifeos-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: npm start
    plan: 0.5c-512mb
    preDeployCommand: npm run migrate
    healthCheckPath: /api/readiness
    maxShutdownDelaySeconds: 30
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lifeos-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: STRICT_PRODUCTION_CONFIG
        value: "true"
      - key: REQUIRE_INVITE
        value: "true"
      - key: WAITLIST_ENABLED
        value: "true"
      - key: BETA_SIGNUPS_OPEN
        value: "true"
      - key: APP_SECRET
        sync: false
      - key: ADMIN_API_KEY
        sync: false

  - type: worker
    name: lifeos-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: npm run worker
    plan: 0.5c-512mb
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lifeos-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: APP_SECRET
        sync: false

  - type: cron
    name: lifeos-scheduler
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: npm run scheduler:once
    plan: 0.5c-512mb
    schedule: "*/15 * * * *"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lifeos-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SCHEDULER_ONESHOT
        value: "true"
