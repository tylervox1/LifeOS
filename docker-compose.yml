services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: lifeos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - lifeos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lifeos"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    command: ["npm","run","migrate"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/lifeos
      APP_SECRET: ${APP_SECRET:-replace-with-a-long-random-secret-at-least-32-chars}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: ["npm","start"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/lifeos
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: ["npm","run","worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/lifeos
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    build: .
    command: ["npm","run","scheduler"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/lifeos
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  lifeos_pg:
