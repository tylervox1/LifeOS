name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: lifeos_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lifeos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lifeos_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lifeos_test
      APP_SECRET: 01234567890123456789012345678901
      DEMO_MODE: "false"
      NODE_ENV: test
      NO_LISTEN: "true"
      SMTP_HOST: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run migrate
      - run: npm run test:unit
      - run: npm run test:integration
      - name: Syntax checks
        run: |
          for f in server/*.js; do node --check "$f"; done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t lifeos-ci .
