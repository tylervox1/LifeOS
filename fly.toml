app = "lifeos-change-me"
primary_region = "sea"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "npm run migrate"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[processes]
  web = "npm start"
  worker = "npm run worker"
  scheduler = "npm run scheduler"

[http_service]
  internal_port = 3000
  force_https = true
  processes = ["web"]
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/readiness"
